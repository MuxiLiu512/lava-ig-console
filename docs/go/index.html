<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Lava｜下載</title>
<style>
body{margin:0;background:#0C0E08;color:#FFE6A9;font-family:Inter,"HarmonyOS Sans TC","PingFang TC",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
main{padding:32px}
a.btn{display:block;margin:14px auto;padding:14px 22px;max-width:320px;border-radius:999px;background:#E84224;color:#fff;text-decoration:none;font-weight:600}
a.alt{background:transparent;border:1px solid rgba(255,230,169,.35);color:#FFE6A9}
p{opacity:.75;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Lava</h1>
  <p>見面，不網聊。</p>
  <a class="btn" id="ios" href="https://apps.apple.com/tw/app/id6749177441">App Store 下載</a>
  <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=tw.lava.app">Google Play 下載</a>
  <a class="btn alt" id="web" href="https://muxiliu512.github.io/lava-ig-console/lp/">先看看 Lava 是什麼</a>
  <p id="hint">正在判斷你的裝置…</p>
</main>
<script>
(function () {
  // 依裝置導向商店；utm 參數原樣帶到 lp 頁與 Play（referrer），App Store 用 ct 記活動。
  var q = location.search || "";
  var params = new URLSearchParams(q);
  var campaign = params.get("utm_campaign") || "";
  var ios = "https://apps.apple.com/tw/app/id6749177441" + (campaign ? "?ct=" + encodeURIComponent(campaign) + "&mt=8" : "");
  var android = "https://play.google.com/store/apps/details?id=tw.lava.app" + (q ? "&referrer=" + encodeURIComponent(q.slice(1)) : "");
  var web = "https://muxiliu512.github.io/lava-ig-console/lp/" + q;
  document.getElementById("ios").href = ios;
  document.getElementById("android").href = android;
  document.getElementById("web").href = web;
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var target = isIOS ? ios : (isAndroid ? android : web);
  document.getElementById("hint").textContent = isIOS ? "前往 App Store…" : (isAndroid ? "前往 Google Play…" : "");
  if (isIOS || isAndroid) setTimeout(function () { location.replace(target); }, 400);
})();
</script>
</body>
</html>
