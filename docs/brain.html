<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>規則本 · Lava</title>
<script>/* 樣式也要帶版本戳〔2026-09-03〕：JS 早就帶了，CSS 沒有——
   於是改了配色、重整卻沒變，跟 8/24、8/25 那兩次「修好了卻看不到」是同一個根因。
   Pages 給靜態資產 10 分鐘快取，單人內部工具正確性遠比快取重要。 */
document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');</script>
<style>
/* 規則本〔學 Stanley 的 Brain：人格與策略是可編輯的正本，不是只有工程師改得到的檔案〕
   左側分頁、右側編輯。存檔直接寫回 repo，撰稿與檢查下一輪就吃到新規則。 */
body { max-width: 1180px; padding: 0 16px 40px; }
.bn-main { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; margin-top: 14px; }
@media (max-width: 860px) { .bn-main { grid-template-columns: 1fr; } }
.bn-nav { display: flex; flex-direction: column; gap: 3px; align-content: start; }
.bn-nav button { display: block; width: 100%; text-align: left; background: none; border: none;
  color: var(--text-2); padding: 9px 12px; border-radius: var(--r-md); font-size: 13.5px;
  transition: background .15s ease, color .15s ease; }
.bn-nav button:hover { background: var(--surface-2); color: var(--text); }
.bn-nav button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
.bn-nav button small { display: block; color: var(--text-3); font-size: 11.5px; font-weight: 400; margin-top: 2px; }
.bn-body { min-width: 0; }
.bn-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.bn-head h2 { font-size: 16px; }
.bn-why { color: var(--text-2); font-size: 13px; margin-bottom: 10px; line-height: 1.65; }
.bn-edit { width: 100%; min-height: 62vh; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px; line-height: 1.75; resize: vertical; }
.bn-bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.bn-bar .meta { margin-left: auto; }
</style>
<script>/* 先套主題，避免載入時閃一下深色 */
try{document.documentElement.setAttribute("data-theme",localStorage.getItem("lava_theme")||"light")}catch(e){}</script>
</head>
<body>
  <header class="topbar" style="margin:0 -16px">
    <a class="icon-btn" href="index.html" title="回工作台" aria-label="回工作台" id="backBtn"></a>
    <div class="title">規則本 <small id="modeTag"></small></div>
    <div class="grow"></div>
    <span class="meta" id="bnHint">改完存檔，下一輪撰稿與檢查就照新規則做</span>
  </header>
  <div class="bn-main">
    <nav class="bn-nav" id="bnNav"></nav>
    <main class="bn-body" id="bnBody">
      <div class="skel" style="height:60vh"></div>
    </main>
  </div>
  <script>
  (function () {
    var v = "?v=" + Date.now();
    ["config.js", "core.js", "terms.js", "ui.js", "brain.js"].forEach(function (f) {
      var s = document.createElement("script");
      s.src = f + v; s.async = false;
      document.head.appendChild(s);
    });
  })();
  </script>
</body>
</html>
