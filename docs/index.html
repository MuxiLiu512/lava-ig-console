<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0e0f11">
  <title>Lava IG 操控室</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="row" style="gap:4px">
      <a class="icon-btn" href="home.html" title="回首頁" style="text-decoration:none">🏠</a>
      <div class="title">Lava IG 操控室 <small id="modeTag"></small></div>
    </div>
    <div class="row" style="gap:6px">
      <a class="btn" href="board.html" style="text-decoration:none;padding:4px 10px;font-size:12px">工作台</a>
      <a class="btn" href="review.html" style="text-decoration:none;padding:4px 10px;font-size:12px">審稿台 v2</a>
      <button class="icon-btn" id="btnSettings" title="設定">⚙︎</button>
    </div>
  </header>

  <main id="app">
    <div class="empty"><span class="spin"></span> 載入中…</div>
  </main>

  <nav class="tabbar">
    <button data-tab="review" class="active"><span class="ic">📥</span>審核<span class="cnt badge-dot hidden" id="cntReview"></span></button>
    <button data-tab="metrics"><span class="ic">📊</span>成效</button>
    <button data-tab="proposals"><span class="ic">💡</span>提案<span class="cnt badge-dot hidden" id="cntProp"></span></button>
    <button data-tab="versions"><span class="ic">🕑</span>版本</button>
  </nav>

  <script>
  // 每次載入都帶時間戳取新檔。GitHub Pages 給靜態資產 Cache-Control: max-age=600，
  // 於是「我修好了、你重整卻沒變化」重複發生了兩次（Jesse 2026-08-24、08-25）——
  // 修的是對的，看到的是十分鐘前的舊程式。單人內部工具，正確性遠比快取重要。
  // async=false 保證動態插入的 script 仍照順序執行（config → core → 頁面）。
  (function () {
    var v = "?v=" + Date.now();
    ["config.js", "core.js", "app.js"].forEach(function (f) {
      var s = document.createElement("script");
      s.src = f + v; s.async = false;
      document.head.appendChild(s);
    });
  })();
  </script>
</body>
</html>
