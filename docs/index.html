<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>工作台 · Lava</title>
<link rel="stylesheet" href="style.css">
<style>
/* 工作台〔藍圖 UI 規格 §3〕：單欄直落四區塊——
   A 全域狀態列（sticky）→ B 待你處理（家）→ C 系統處理中（收合）→ D 已完成（收合）。
   桌面 ≥1024 佇列卡兩欄，其餘不變。舊的五欄看板已廢：欄位是系統視角，
   四區塊是「跟我有關嗎」的人視角。 */
body { max-width: 880px; padding: 0 16px 60px; }
#zoneA { position: sticky; top: 0; z-index: 25; background: var(--bg);
  padding: 10px 0 8px; }
</style>
</head>
<body>
  <header class="topbar" style="margin:0 -16px">
    <div class="title">工作台 <small id="modeTag"></small></div>
    <div class="grow"></div>
    <a class="btn ghost" href="reel.html" style="min-height:30px;padding:4px 12px;font-size:13px">影片</a>
    <a class="btn ghost" href="brain.html" style="min-height:30px;padding:4px 12px;font-size:13px">規則本</a>
    <button class="icon-btn" id="btnSettings" title="設定 GitHub PAT" aria-label="設定"></button>
  </header>
  <div id="zoneA"></div>
  <main id="bdMain"><div class="skel" style="height:120px;margin-top:12px" aria-busy="true" aria-label="載入中"></div></main>
  <div class="drawer-panel" id="bdDrawer"></div>
  <script>
  // 每次載入都帶時間戳取新檔：GitHub Pages 靜態資產快取 10 分鐘，
  // 「我修好了、你重整卻沒變化」發生過兩次（2026-08-24、08-25）。
  // async=false 保證動態插入的 script 照順序執行。
  (function () {
    var v = "?v=" + Date.now();
    ["config.js", "core.js", "terms.js", "ui.js", "board.js"].forEach(function (f) {
      var s = document.createElement("script");
      s.src = f + v; s.async = false;
      document.head.appendChild(s);
    });
  })();
  </script>
</body>
</html>
