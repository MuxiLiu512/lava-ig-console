<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lava</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #E84224;
  --orange-light: #ff5c3a;
  --dark: #0C0E08;
  --dark2: #161810;
  --dark3: #1e2018;
  --border: rgba(255,255,255,0.08);
  --muted: rgba(255,255,255,0.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--dark);
  color: #fff;
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 15% 5%, rgba(232,66,36,0.13) 0%, transparent 55%),
    radial-gradient(ellipse 60% 70% at 85% 95%, rgba(232,66,36,0.09) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}
.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 44px 24px 64px;
  position: relative;
  z-index: 1;
}
.logo-wrap {
  text-align: center;
  margin-bottom: 10px;
  animation: fadeUp 0.6s ease both;
}
.logo-wrap img { height: 42px; width: auto; }
.tagline {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.15em;
  margin-bottom: 44px;
  font-weight: 300;
  animation: fadeUp 0.6s 0.08s ease both;
}
.section-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.section-label::before,
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.section-label span {
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--muted);
  white-space: nowrap;
  text-transform: uppercase;
  font-weight: 500;
}
.s1 { animation: fadeUp 0.6s 0.15s ease both; }
.download-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 44px;
  animation: fadeUp 0.6s 0.22s ease both;
}
.dl-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 68px;
  border-radius: 18px;
  background: var(--dark3);
  border: 1px solid var(--border);
  text-decoration: none;
  transition: all 0.28s ease;
  position: relative;
  overflow: hidden;
}
.dl-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(232,66,36,0.09), transparent 60%);
  opacity: 0;
  transition: opacity 0.25s;
}
.dl-btn:hover {
  border-color: rgba(232,66,36,0.38);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(232,66,36,0.14);
}
.dl-btn:hover::after { opacity: 1; }
.dl-btn img { height: 38px; width: auto; object-fit: contain; position: relative; z-index: 1; }
.s2 { animation: fadeUp 0.6s 0.3s ease both; }
.venue-card {
  display: block;
  text-decoration: none;
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: 22px;
  overflow: hidden;
  transition: all 0.3s ease;
  position: relative;
  animation: fadeUp 0.6s 0.37s ease both;
}
.venue-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--orange), #ff7a5a);
}
.venue-card:hover {
  border-color: rgba(232,66,36,0.32);
  transform: translateY(-3px);
  box-shadow: 0 20px 60px rgba(232,66,36,0.13);
}
.venue-inner { padding: 30px 28px 26px; }
.venue-eye {
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--orange);
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 14px;
}
.venue-headline {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.32;
  margin-bottom: 12px;
  color: #fff;
}
.venue-sub {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 26px;
  font-weight: 300;
}
.venue-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--orange);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  padding: 13px 24px;
  border-radius: 100px;
  letter-spacing: 0.03em;
  transition: all 0.22s;
}
.venue-card:hover .venue-cta {
  background: var(--orange-light);
  gap: 12px;
}
.footer {
  text-align: center;
  margin-top: 52px;
  font-size: 11px;
  color: rgba(255,255,255,0.18);
  letter-spacing: 0.1em;
  animation: fadeUp 0.6s 0.5s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>

<!-- ── Lava 成效追蹤（2026-08-22 自 wei-yin-hwang/lava-ig-link 複製本頁後加上）──
     為什麼要有這段：原始落地頁 0 個 script、零分析碼，導致漏斗在這裡斷掉——
     我們量得到「有人點連結」（/go/ 計數頁，近 28 天 232 次），
     但完全量不到「有人真的去商店」。北極星是下載，不是點擊。
     store_click 事件會分開記 ios / android，並帶上 utm 讓來源分流看得到。 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8SE6BYLL3N"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-8SE6BYLL3N');
function lavaUtm() {
  var p = new URLSearchParams(window.location.search);
  return {
    utm_source:  p.get('utm_source')  || '(none)',
    utm_medium:  p.get('utm_medium')  || '(none)',   // reply / bio / post / social
    utm_content: p.get('utm_content') || '(none)'    // draft_id 前 8 碼 → 回溯單則
  };
}

document.addEventListener('click', function (e) {
  if (!e.target || !e.target.closest) return;

  // ① 商店按鈕（.dl-btn，在「用戶專區」底下）＝北極星的最後一哩
  var a = e.target.closest('a[href*="apps.apple.com"],a[href*="play.google.com"]');
  if (a) {
    gtag('event', 'store_click', Object.assign(
      { store: a.href.indexOf('apps.apple.com') > -1 ? 'ios' : 'android' }, lavaUtm()));
    return;
  }

  // ② 商家招募（.venue-card）＝完全不同的受眾。
  //    這頁同時服務「想交友的人」和「想合作的店家」，混在一起算轉換率會失真——
  //    海巡帶來的流量若大量點這裡，代表我們的內容打到了錯的人。
  var v = e.target.closest('a.venue-card,a[href*="lava-venue"]');
  if (v) {
    gtag('event', 'venue_click', lavaUtm());
  }
});

// ③ 捲動深度 50%：這頁 59KB 很長，若多數人只看到第一屏就走，
//    問題在首屏而不在流量。GA4 增強型評估只內建 90%，50% 要自己送。
//    只送一次（用 fired 旗標），否則來回捲會灌爆事件數。
(function () {
  var fired = false;
  window.addEventListener('scroll', function () {
    if (fired) return;
    var h = document.documentElement;
    var depth = (h.scrollTop + window.innerHeight) / h.scrollHeight;
    if (depth >= 0.5) {
      fired = true;
      gtag('event', 'scroll_50', lavaUtm());
    }
  }, { passive: true });
})();
</script>
